repos:
  # The Go-built gitleaks hook is blocked by an Application Control policy on this Windows
  # machine (WinError 4551), so the scan runs inside Docker instead (needs Docker Desktop running).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run python -m pre_commit_hooks.check_added_large_files --maxkb=1024
        language: system
      - id: mypy-strict
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: policy-doc-in-sync
        name: POLICY.md matches policy.yaml
        entry: uv run python scripts/render_policy.py --check
        language: system
        files: ^(policy/policy\.yaml|docs/POLICY\.md|src/invoice_agent/policy_render\.py)$
        pass_filenames: false
