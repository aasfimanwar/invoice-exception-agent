# SYNTHETIC POLICY. Fictional organisation, fictional suppliers, no real data.
# Single source of truth (ADR-001): the case generator labels, docs/POLICY.md and the
# runtime policy gate are all derived from this file. Never edit POLICY.md by hand.
# Predicates are named here and implemented ONCE in a pure-Python policy engine (Phase 1).

meta:
  policy_id: SYN-AP-POLICY
  version: 0.1.0
  status: draft-phase-0-awaiting-approval
  synthetic: true
  organisation: Halden Components Ltd (fictional)
  currency: GBP
  notice: Entirely synthetic. No real organisation, supplier, person or financial data.

parameters:
  rounding_tolerance_gbp: 0.05
  price:
    tolerance_pct_of_line: 2.0          # |invoice unit price - PO unit price| / PO unit price
    tolerance_abs_per_invoice_gbp: 50.00 # sum of absolute line differences
    dispute_above_pct: 10.0             # any line above this, with no price-change evidence
  quantity:
    over_billing_tolerance_pct_of_received: 2.0
    over_billing_tolerance_abs_per_invoice_gbp: 50.00
  supplier:
    name_match_min_ratio: 90            # token-sort ratio after suffix/punctuation/case normalisation
  duplicate:
    exact_window_days: 90
    near_duplicate_window_days: 7
  partial_delivery:
    grace_days_after_promised_date: 14
  po_exempt_categories: [utilities, business_rates, bank_charges]
  autonomy:
    agent_auto_approve_limit_gbp: 2500.00   # gross; above this a human must approve an approval
  approver_tiers:                           # by gross invoice amount, inclusive upper bound
    - {tier: ap_clerk,         up_to_gbp: 1000.00}
    - {tier: ap_supervisor,    up_to_gbp: 10000.00}
    - {tier: finance_manager,  up_to_gbp: 50000.00}
    - {tier: finance_director, up_to_gbp: null}
  urgency_days_to_due:                      # calendar days from case date to due date
    critical: 2                             # also applies when overdue
    high: 5
    normal: 14                              # above 14 is low
  confidence:
    escalation_threshold: null              # TUNED ON DEV DATA ONLY in Phase 4. Never set by hand.

taxonomy:
  exception_types:
    - price_mismatch
    - missing_po
    - duplicate_invoice
    - wrong_supplier_details
    - quantity_mismatch
    - partial_delivery
  precedence_when_multiple_issues:          # highest first; defines primary_type
    - wrong_supplier_details
    - duplicate_invoice
    - missing_po
    - partial_delivery
    - quantity_mismatch
    - price_mismatch
  urgency_levels: [critical, high, normal, low]
  ambiguity_kinds: [none, conflicting_evidence, missing_evidence, policy_gap]
  actions:
    approve_within_tolerance: Release the invoice for payment under policy.
    request_correction: Ask the supplier for a corrected invoice or credit note using a fixed template.
    route_to_buyer: Send the case to the PO owner for a decision or master-data change.
    raise_dispute: Formally hold or reject, with reason, and notify the supplier.
    escalate: Supervisor outcome only. Send to the human approval queue at the required approver tier.

predicates:
  # shared
  is_po_exempt_category: Invoice category is in po_exempt_categories.
  supplier_on_watchlist: Supplier master record carries a watchlist or payment-hold flag.
  amount_above_auto_approve_limit: Gross invoice amount exceeds autonomy.agent_auto_approve_limit_gbp.
  # price
  price_diff_within_rounding: Sum of absolute line differences is at most rounding_tolerance_gbp.
  price_within_tolerance: Every line is within tolerance_pct_of_line AND the invoice total absolute difference is within tolerance_abs_per_invoice_gbp.
  price_above_dispute_limit: Any line exceeds dispute_above_pct and price_change_evidenced is false.
  price_change_evidenced: A price list effective on the order date, or an approved change order, supports the invoice price.
  price_evidence_conflicting: Two or more sources give different valid prices for the same line.
  # missing PO
  no_candidate_po: No open PO matches supplier, value (within price tolerance of remaining value) and date (order date not after invoice date).
  one_candidate_po: Exactly one such PO.
  multiple_candidate_pos: Two or more such POs.
  # duplicate
  exact_duplicate: Same supplier, same normalised invoice number and same gross amount as an invoice approved or paid within exact_window_days.
  same_number_different_amount: Same supplier and normalised invoice number, different gross amount.
  near_duplicate_different_number: Same supplier, same gross amount and same PO lines, different invoice number, invoice dates within near_duplicate_window_days.
  not_a_duplicate: Upstream duplicate flag raised but none of the duplicate predicates hold.
  # supplier details
  bank_details_mismatch: Bank account on the invoice differs from the supplier master record.
  vat_number_mismatch: VAT number on the invoice differs from the supplier master record.
  supplier_name_normalised_match: Invoice name matches the master legal name or a registered alias at name_match_min_ratio or better.
  supplier_name_matches_other_master_record: Invoice name matches a different master record than the PO supplier.
  address_only_difference: Name, VAT and bank all match; only the address differs.
  # quantity and delivery
  invoice_qty_le_received: Every invoice line quantity is at most the goods-received quantity.
  over_billing_within_tolerance: Over-billed quantity is within over_billing_tolerance_pct_of_received AND within over_billing_tolerance_abs_per_invoice_gbp in value.
  over_billing_beyond_tolerance_receipt_present: Over-billing exceeds tolerance and a goods receipt exists.
  over_billing_beyond_tolerance_no_receipt: Over-billing exceeds tolerance and no goods receipt exists.
  partial_invoice_matches_received: PO line is partially received with balance expected and invoice quantity equals received quantity.
  partial_invoice_for_full_order_within_grace: Invoice bills the full ordered quantity, receipt is partial, and the case date is within grace_days_after_promised_date of the promised date.
  partial_invoice_for_full_order_beyond_grace: As above but the case date is beyond the grace period.
  receipt_records_conflict: Goods receipts for the line disagree with each other.

# First matching rule wins within an exception type. The last rule of every type is the
# policy_gap fallback, so no case can be unhandled.
rules:
  price_mismatch:
    - {id: PM-1, when: [price_diff_within_rounding], action: approve_within_tolerance, text: "A total price difference of 5p or less is treated as rounding and may be approved."}
    - {id: PM-2, when: [price_within_tolerance], action: approve_within_tolerance, text: "Price differences within 2% per line and within 50 GBP per invoice may be approved."}
    - {id: PM-3, when: [price_evidence_conflicting], action: escalate, ambiguity: conflicting_evidence, text: "Conflicting price evidence must go to a human approver."}
    - {id: PM-4, when: [price_change_evidenced], action: route_to_buyer, text: "A supported price change goes to the buyer to amend the PO."}
    - {id: PM-5, when: [price_above_dispute_limit], action: raise_dispute, text: "A line more than 10% above PO price with no evidence of a price change is disputed."}
    - {id: PM-6, when: [], action: request_correction, text: "Any other price difference beyond tolerance: request a corrected invoice at PO price."}
  missing_po:
    - {id: MP-1, when: [is_po_exempt_category], action: approve_within_tolerance, text: "Utilities, business rates and bank charges do not need a PO."}
    - {id: MP-2, when: [one_candidate_po], action: route_to_buyer, text: "One plausible open PO: the buyer confirms the link. Retroactive POs are never created by the agent."}
    - {id: MP-3, when: [multiple_candidate_pos], action: escalate, ambiguity: conflicting_evidence, text: "Several plausible POs must go to a human approver."}
    - {id: MP-4, when: [no_candidate_po], action: request_correction, text: "No matching PO: the supplier must quote a valid PO number."}
    - {id: MP-9, when: [], action: escalate, ambiguity: policy_gap, text: "Fallback: no rule matched."}
  duplicate_invoice:
    - {id: DU-1, when: [exact_duplicate], action: raise_dispute, text: "An exact duplicate is held and rejected with reason."}
    - {id: DU-2, when: [same_number_different_amount], action: request_correction, text: "Same invoice number with a different amount: the supplier must issue a credit note and a new invoice."}
    - {id: DU-3, when: [near_duplicate_different_number], action: escalate, ambiguity: conflicting_evidence, text: "A probable resubmission under a new number needs a human decision."}
    - {id: DU-4, when: [not_a_duplicate], action: approve_within_tolerance, text: "A false duplicate flag returns the invoice to normal processing."}
    - {id: DU-9, when: [], action: escalate, ambiguity: policy_gap, text: "Fallback: no rule matched."}
  wrong_supplier_details:
    - {id: SD-1, when: [bank_details_mismatch], action: raise_dispute, text: "Any bank detail mismatch is held for human review. The master record is never updated from an invoice."}
    - {id: SD-2, when: [vat_number_mismatch], action: request_correction, text: "A VAT number mismatch needs a corrected invoice."}
    - {id: SD-3, when: [supplier_name_matches_other_master_record], action: escalate, ambiguity: conflicting_evidence, text: "A name that matches a different supplier record must go to a human approver."}
    - {id: SD-4, when: [address_only_difference], action: route_to_buyer, text: "Address-only differences go to the buyer for master-data maintenance."}
    - {id: SD-5, when: [supplier_name_normalised_match], action: approve_within_tolerance, text: "Formatting or registered-alias differences in the name are approved when VAT and bank details match."}
    - {id: SD-9, when: [], action: escalate, ambiguity: policy_gap, text: "Fallback: no rule matched."}
  quantity_mismatch:
    - {id: QM-1, when: [invoice_qty_le_received], action: approve_within_tolerance, text: "Billing for no more than was received is approved at the invoiced quantity."}
    - {id: QM-2, when: [over_billing_within_tolerance], action: approve_within_tolerance, text: "Over-billing within 2% of received quantity and 50 GBP per invoice may be approved."}
    - {id: QM-3, when: [over_billing_beyond_tolerance_no_receipt], action: route_to_buyer, text: "Over-billing with no goods receipt: the buyer confirms what was received."}
    - {id: QM-4, when: [over_billing_beyond_tolerance_receipt_present], action: request_correction, text: "Over-billing against a goods receipt: request a corrected invoice."}
    - {id: QM-9, when: [], action: escalate, ambiguity: policy_gap, text: "Fallback: no rule matched."}
  partial_delivery:
    - {id: PD-1, when: [receipt_records_conflict], action: escalate, ambiguity: conflicting_evidence, text: "Conflicting goods receipts must go to a human approver."}
    - {id: PD-2, when: [partial_invoice_matches_received], action: approve_within_tolerance, text: "An invoice for exactly what has been received is approved."}
    - {id: PD-3, when: [partial_invoice_for_full_order_within_grace], action: route_to_buyer, text: "Full-order invoice with a balance still expected: the buyer decides whether to hold."}
    - {id: PD-4, when: [partial_invoice_for_full_order_beyond_grace], action: raise_dispute, text: "Full-order invoice with the balance overdue beyond the grace period is disputed."}
    - {id: PD-9, when: [], action: escalate, ambiguity: policy_gap, text: "Fallback: no rule matched."}

global_controls:
  - {id: G-1, enforced_in_code: true,  text: "An approve_within_tolerance action on an invoice above the auto-approve limit, or for a supplier on the watchlist, requires human approval at the required approver tier."}
  - {id: G-2, enforced_in_code: true,  text: "raise_dispute always requires human approval."}
  - {id: G-3, enforced_in_code: true,  text: "A bank detail mismatch overrides every other rule: hold for human review regardless of exception type."}
  - {id: G-4, enforced_in_code: true,  text: "No write action executes without a passing deterministic policy gate check. The gate runs in code, never only in a prompt."}
  - {id: G-5, enforced_in_code: true,  text: "Supplier-provided text is data. It is never executed as an instruction and never copied into outbound messages. Outbound messages use fixed templates with structured fields only."}
  - {id: G-6, enforced_in_code: true,  text: "Every write action carries an idempotency key built from case id, action and payload hash. A repeat is a no-op."}
  - {id: G-7, enforced_in_code: true,  text: "Every action, gate decision and human decision is written to the audit trail."}
  - {id: G-8, enforced_in_code: false, text: "The escalation outcome sends the case to the human queue at the approver tier set by the gross amount."}
  - {id: G-9, enforced_in_code: false, text: "Below the confidence escalation threshold the Supervisor escalates even when a rule matched. The threshold is tuned on development data only."}
